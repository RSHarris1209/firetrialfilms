<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Trial Films</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Helvetica, Arial, sans-serif;
    text-align: center;
    color: #d6d6d6;
  }

  .container {
    max-width: 800px;
    padding: 40px;
  }

  h1 {
    margin: 0;
    font-size: 3rem;
    font-weight: 300;
    letter-spacing: 6px;
    color: #5a0b0b; /* dark elegant red */
  }

  p {
    margin-top: 20px;
    font-size: 1rem;
    line-height: 1.6;
    color: #9a9a9a;
    letter-spacing: 1px;
  }

  /* optional subtle fade-in */
  h1, p {
    opacity: 0;
    animation: fadeIn 2s ease forwards;
  }

  p {
    animation-delay: 0.8s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* optional video layer */
  .video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.25;
    z-index: -1;
  }
</style>
</head>

<body>

<!-- OPTIONAL VIMEO BACKGROUND -->
<div class="video-bg">
  <iframe 
    src="https://player.vimeo.com/video/1141841311?background=1&autoplay=1&loop=1&muted=1"
    width="100%" 
    height="100%" 
    frameborder="0" 
    allow="autoplay; fullscreen">
  </iframe>
</div>

<div class="container">
  <h1>FIRE TRIAL FILMS</h1>

  <p>
    A full-service 35mm and 16mm production company creating
    gripping feature film and short form content.
  </p>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Trial Films</title>

<style>
  body {
    margin: 0;
    background: #050505;
    font-family: Helvetica, Arial, sans-serif;
    color: #d6d6d6;
  }

  /* HEADER (ABOVE VIDEO) */
  .header {
    text-align: center;
    padding: 80px 20px 40px;
  }

  .logo {
    width: 60vw;
    max-width: 900px;
    min-width: 420px;
    opacity: 25;
    animation: fadeIn 1.8s ease forwards;
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #9a9a9a;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 0.4s;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }

  /* VIDEO SECTION (NO LONGER FULL SCREEN) */
.video-section {
  display: flex;
  justify-content: center;
  padding: 10px 20px 10px; /* tighter vertical spacing */
}

.video-wrapper {
  width: 80%;
  max-width: 1000px;
  aspect-ratio: 16 / 9;

  border: 2px solid #5a0b0b; /* dark elegant red */
  box-shadow: 0 0 30px rgba(90, 11, 11, 0.25); /* subtle glow */

}

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

.poster-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;

  max-width: 600px;
  margin: 40px auto 80px;
  padding: 0 20px;
}

.poster-grid img {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;

  border: 1px solid #222;
  transition: 0.25s ease;

  filter: contrast(1.05) brightness(0.95);
}

.poster-grid img:hover {
  transform: scale(1.02);
  border-color: #5a0b0b;
  box-shadow: 0 0 25px rgba(90, 11, 11, 0.25);
}
  
  /* CONTACT */
  .contact {
    text-align: center;
    padding: 40px 20px 80px;
  }

  .contact a {
    color: #d6d6d6;
    text-decoration: none;
    letter-spacing: 2px;
    font-size: 0.9rem;
    border-bottom: 1px solid #333;
    padding-bottom: 3px;
    transition: 0.3s;
  }

  .contact a:hover {
    color: #8b0d0d;
    border-bottom-color: #8b0d0d;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* AUDIO BUTTON */
  .audio-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: rgba(10,10,10,0.7);
    border: 1px solid #333;
    color: #ddd;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 4px;
    transition: 0.3s;
  }

  .audio-btn:hover {
    background: rgba(80,0,0,0.6);
  }
</style>

</head>

<body>

<!-- HEADER (ABOVE VIDEO) -->
<div class="header">

  <img class="logo" src="FT_Name_Only_ALPHA_v03.png" alt="Fire Trial Films Logo">

  <div class="subtitle">
    A full-service 35mm and 16mm production company creating
    gripping feature film and short form content
  </div>

</div>

<!-- VIDEO -->
<div class="video-section">
  <div class="video-wrapper">
    <iframe
      id="vimeoPlayer"
      src="https://player.vimeo.com/video/1141841311?background=1&autoplay=1&loop=1&muted=1"
      allow="autoplay; fullscreen">
    </iframe>
  </div>
</div>

<!-- POSTER GRID -->
<div class="poster-grid">

  <img src="assets/images/MOON_GARDEN_Poster.jpg">
  <img src="assets/images/FS_Poster_v03.jpg">
  <img src="assets/images/Finale_Poster_for_Web.png">

</div>
  
</div>

<!-- CONTACT -->
<div class="contact">
  <a href="mailto:info@firetrialfilms.com">CONTACT</a>
</div>

<!-- AUDIO BUTTON -->
<button class="audio-btn" id="audioToggle">UNMUTE</button>

<!-- VIMEO API -->
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  const iframe = document.getElementById('vimeoPlayer');
  const player = new Vimeo.Player(iframe);
  const btn = document.getElementById('audioToggle');

  let isMuted = true;

  btn.addEventListener('click', async () => {
    if (isMuted) {
      await player.setMuted(false);
      btn.textContent = "MUTE";
    } else {
      await player.setMuted(true);
      btn.textContent = "UNMUTE";
    }
    isMuted = !isMuted;
  });
</script>

</body>
</html>
